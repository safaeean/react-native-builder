# Example .gitlab-ci.yml for a React Native project.
# Copy this into the ROOT of your React Native project's repository
# (rename it to .gitlab-ci.yml) and adjust variables as needed.
#
# It uses the "react-native-builder" Docker image built from this
# repository, which already contains Node.js, JDK 17, and the Android SDK
# command-line tools/platform/build-tools needed to assemble Android
# APK/AAB outputs.

image: ghcr.io/safaeean/react-native-builder:latest
# If the GHCR package is private, add credentials instead:
# image:
#   name: ghcr.io/safaeean/react-native-builder:latest
#   pull_policy: always
# and in before_script:
#   - echo "$GHCR_TOKEN" | docker login ghcr.io -u <github-username> --password-stdin

stages:
  - build
  - release

variables:
  # Cache node_modules and gradle between pipelines for faster builds
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .gradle/
    - android/.gradle/

before_script:
  - npm ci
  # If your project uses Yarn (has yarn.lock instead of package-lock.json):
  # - yarn install --frozen-lockfile

build_android_apk:
  stage: build
  script:
    - cd android
    - chmod +x ./gradlew
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - android/app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

build_android_aab:
  stage: build
  script:
    - cd android
    - chmod +x ./gradlew
    - ./gradlew bundleRelease
  artifacts:
    paths:
      - android/app/build/outputs/bundle/release/*.aab
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG'

# --- Publish the APK as a GitLab Release (only on tags, e.g. v1.0.0) ---
# Requires build_android_apk to have run first and produced the APK artifact.
upload_apk_to_package_registry:
  stage: release
  needs: ["build_android_apk"]
  script:
    - |
      APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
      APK_NAME="app-${CI_COMMIT_TAG}.apk"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${APK_PATH}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/android-builds/${CI_COMMIT_TAG}/${APK_NAME}"
  rules:
    - if: '$CI_COMMIT_TAG'

create_release:
  stage: release
  needs: ["upload_apk_to_package_registry"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "app-${CI_COMMIT_TAG}.apk"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/android-builds/${CI_COMMIT_TAG}/app-${CI_COMMIT_TAG}.apk"
  rules:
    - if: '$CI_COMMIT_TAG'

# To trigger this: create a git tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
# The APK will then show up under Deployments > Releases in your GitLab project,
# downloadable directly from there.

# --- Signing notes ---
# For a signed release build, provide these as GitLab CI/CD variables
# (masked/protected), and reference them from android/app/build.gradle
# signingConfigs, e.g.:
#   MYAPP_UPLOAD_STORE_FILE, MYAPP_UPLOAD_KEY_ALIAS,
#   MYAPP_UPLOAD_STORE_PASSWORD, MYAPP_UPLOAD_KEY_PASSWORD
#
# You can decode a base64-encoded keystore stored in a CI variable like this
# in `before_script`:
#   - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
